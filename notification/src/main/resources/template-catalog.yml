# Notification template catalog.
#
# Each entry maps an internal template key (used in code) to provider-specific
# template identifiers. Template content itself lives in the provider (SES /
# SendGrid for email, Meta for WhatsApp, telco DLT registration for India SMS).
#
# This service does NOT render template bodies for templated channels --- it
# passes the provider template ID + variables and lets the provider merge.
# The one exception is FREE_TEXT SMS, where 'body' below is rendered locally
# with simple {{var}} substitution.

templates:

  # ----- EMAIL -----------------------------------------------------------
  EMAIL_VERIFICATION:
    channel: EMAIL
    providers:
      ses:
        template_name: notification_email_verification_v1
      sendgrid:
        template_id: d-PLACEHOLDER-EMAIL-VERIFICATION
    variables:
      - otp
      - firstName
      - expiresAt

  WELCOME_EMAIL:
    channel: EMAIL
    providers:
      ses:
        template_name: notification_welcome_v1
      sendgrid:
        template_id: d-PLACEHOLDER-WELCOME
    variables:
      - firstName

  # ----- SMS (regulated -- India / DLT) ---------------------------------
