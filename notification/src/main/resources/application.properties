spring.application.name=notification
server.port=8081

# PostgreSQL (same DB as accounts; isolated by schema)
spring.datasource.url=jdbc:postgresql://localhost:5432/vectordbpg
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=notification_service
spring.jpa.show-sql=false

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Kafka topics (must match accounts NotificationProducer)
kafka.topics.email-verification=notification.email.verification
kafka.topics.welcome-email=notification.email.welcome
kafka.topics.sms-otp=notification.sms.otp

# Template catalog location (classpath)
notification.template-catalog.location=classpath:template-catalog.yml

# Channel / provider routing
notification.channels.email.primary-provider=ses
notification.channels.email.fallback-providers=sendgrid
notification.from.email=no-reply@trainbooking.example
notification.from.email-name=Train Booking

# AWS SES (region + creds via env vars: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION)
aws.ses.region=${AWS_REGION:us-east-1}
aws.ses.configuration-set=

# SendGrid (creds via env var SENDGRID_API_KEY)
sendgrid.api-key=${SENDGRID_API_KEY:}

# Circuit breaker (per provider)
notification.circuit-breaker.failure-rate-threshold=50
notification.circuit-breaker.minimum-number-of-calls=10
notification.circuit-breaker.sliding-window-size=20
notification.circuit-breaker.wait-duration-in-open-state-seconds=30
notification.circuit-breaker.permitted-calls-in-half-open=3

# Retry worker
notification.retry.max-attempts=5
notification.retry.stuck-after-seconds=120
notification.retry.scan-interval-ms=30000

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator (expose circuit breaker health)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
