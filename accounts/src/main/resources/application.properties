spring.application.name=accounts

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/vectordbpg
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=account_service
spring.jpa.show-sql=false

# JWT
jwt.secret=hJtXIZ2uSN5kb3M7T0iL5l5fP7e1M7yJ9k6w8mV0y7A=
jwt.access-token-expiry-seconds=900
jwt.refresh-token-expiry-seconds=2592000

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka topics — accounts emits domain facts; the notification service decides what to send
kafka.topics.account-events=account.events

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Account locking
auth.max-failed-attempts=5
auth.lock-duration-minutes=30
